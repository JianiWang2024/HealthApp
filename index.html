<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="健康日记">
<meta name="theme-color" content="#fffaf2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍡%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<title>软糖健康日记</title>
<style>
:root{--bg:#fff4f6;--card:#fff;--tx:#5b4651;--sub:#a38f98;--ac:#ff7fa1;--ac2:#ffe4ec;--bd:#ffd3df;--mint:#c9f0e0;--sun:#fff0bd;--sky:#d6ecff;--red:#f0627a;--grn:#3fb98a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#201820;--card:#2c222b;--tx:#f7e8ee;--sub:#b39ba6;--ac:#ff8fb0;--ac2:#43303b;--bd:#4d3846;--mint:#24463a;--sun:#4a4023;--sky:#263a4d;--red:#ff8095;--grn:#5fd3a6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#201820;--card:#2c222b;--tx:#f7e8ee;--sub:#b39ba6;--ac:#ff8fb0;--ac2:#43303b;--bd:#4d3846;--mint:#24463a;--sun:#4a4023;--sky:#263a4d;--red:#ff8095;--grn:#5fd3a6;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--tx);font:15px/1.5 "Nunito",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(var(--bd) 1.5px,transparent 1.5px) 0 0/22px 22px,var(--bg);padding-bottom:96px}
.wrap{max-width:560px;margin:0 auto;padding:12px}
.date{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.date button{width:38px;height:38px;border-radius:50%;padding:0;font-size:18px}
.date input{border:0;background:var(--card);border-radius:20px;padding:6px 14px;font-size:16px;font-weight:700;box-shadow:0 3px 0 var(--bd)}
.card{background:var(--card);border:2px solid var(--bd);border-radius:22px;padding:14px;margin-bottom:14px;box-shadow:0 4px 0 var(--bd)}
h3{margin:0 0 10px;font-size:16px}
button,input,select,textarea{font:inherit;color:var(--tx)}
button{border:2px solid var(--bd);background:var(--card);border-radius:999px;padding:7px 16px;cursor:pointer;box-shadow:0 3px 0 var(--bd);transition:transform .1s}
button:active{transform:translateY(3px);box-shadow:none}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700;box-shadow:0 3px 0 #e0678a}
input,select,textarea{border:2px solid var(--bd);background:var(--bg);border-radius:14px;padding:8px 12px;min-width:0;width:100%}
textarea{resize:vertical}
.row{display:flex;gap:8px;margin-bottom:10px;align-items:center}.row>*{flex:1}.row>button{flex:none}
.seg{display:flex;background:var(--ac2);border-radius:999px;padding:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;box-shadow:none;padding:5px}
.seg button.on{background:var(--card);color:var(--ac);font-weight:700;box-shadow:0 2px 0 var(--bd)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chips button{padding:6px 12px}.chips button.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:700}
.item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:2px dashed var(--bd)}
.item:first-of-type{border-top:0}
.sub{color:var(--sub);font-size:13px}
.x{border:0;background:none;box-shadow:none;color:var(--sub);padding:2px 8px}
.banner{background:linear-gradient(135deg,#ffb3c8,#ffd6a5);border-radius:26px;padding:16px;color:#5b3a46;display:flex;gap:12px;align-items:center;margin-bottom:14px;box-shadow:0 4px 0 #f0a3b8}
.mas{font-size:54px;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
@media (prefers-reduced-motion:reduce){.mas{animation:none}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.t{border-radius:20px;padding:12px;color:#4a3a42}.t b{font-size:22px;display:block}
.t.a{background:var(--sun)}.t.b{background:var(--mint)}.t.c{background:var(--sky)}.t.d{background:var(--ac2)}
:root:not([data-theme="light"]) .t{color:var(--tx)}
.bar{height:12px;background:var(--ac2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:6px}
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;display:flex;background:var(--card);border:2px solid var(--bd);border-radius:999px;padding:4px;box-shadow:0 4px 0 var(--bd)}
.tabs button{flex:1;border:0;box-shadow:none;background:none;padding:6px 0;color:var(--sub);font-size:11px;border-radius:999px}
.tabs button b{display:block;font-size:20px;font-weight:400}
.tabs button.on{background:var(--ac2);color:var(--ac);font-weight:700}
.cups{display:flex;gap:6px;flex-wrap:wrap}.cups button{width:38px;height:38px;padding:0;font-size:18px;filter:grayscale(1);opacity:.45}.cups button.on{filter:none;opacity:1;background:var(--sky)}
svg{width:100%;height:auto;display:block}
.ln{fill:none;stroke:var(--ac);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.dt{fill:var(--card);stroke:var(--ac);stroke-width:2.5}
.gl{stroke:var(--grn);stroke-dasharray:5 4;stroke-width:1.5}.gr{stroke:var(--bd)}.tl{fill:var(--sub);font-size:10px}.br{fill:var(--ac)}
.out{color:var(--red)}.inc{color:var(--grn)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9;white-space:nowrap}
#toast.on{opacity:1}
:root{--bg:#fffaf2;--card:#fffefb;--tx:#6a5a5f;--sub:#a99a9f;--ac:#f6a1b8;--ac2:#fde6ec;--bd:#ecdcd5;--ln:#8c7b80;--mint:#d7f0e4;--sun:#fff0c2;--sky:#d3ebfa;--red:#ec6f87;--grn:#4cb890}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1a1d;--card:#2a2327;--tx:#f3e7ea;--sub:#b5a2a9;--bd:#3f3238;--ln:#d9c5cc;--ac2:#41303a}}
:root[data-theme="dark"]{--bg:#1f1a1d;--card:#2a2327;--tx:#f3e7ea;--sub:#b5a2a9;--bd:#3f3238;--ln:#d9c5cc;--ac2:#41303a}
body{font-family:"Hiragino Maru Gothic ProN","Yuanti SC","Nunito","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(var(--bd) 1.2px,transparent 1.2px) 0 0/24px 24px,var(--bg)}
.card,.t,.tabs,.date input,.bar,.seg{border:2px solid var(--ln);box-shadow:none}
.card{border-radius:20px}.seg{background:var(--card)}.bar{background:var(--card);height:14px}
button{border-color:var(--ln);box-shadow:none}button:active{transform:scale(.95)}
button.p{border-color:var(--ln);color:#5a3a44;box-shadow:none}
.chips button.on,.seg button.on{border-color:var(--ln);box-shadow:none;color:var(--tx)}.seg button.on{background:var(--ac)}
.banner{background:var(--sun);color:var(--tx);box-shadow:none;border:2px solid var(--ln);padding:10px 14px;border-radius:20px}
.mas{font-size:0;line-height:0;animation:none}
.tabs button{font-size:10.5px}.tabs button b{font-size:18px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.tt{display:flex;align-items:center;font-weight:700;font-size:17px;gap:6px}.tt #mm{display:flex;margin-right:2px}
.wk,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.wk button,.cal button{display:flex;flex-direction:column;align-items:center;padding:6px 0;border-radius:14px;line-height:1.25;min-width:0}
.wk button.done{background:var(--mint)}.wk button.cur,.cal button.cur{outline:3px solid var(--ac);outline-offset:1px}.wk .th{font-size:15px;height:20px}
.cal button{min-height:46px}.cal button span{display:block;height:8px;line-height:8px}.cal u{display:inline-block;width:6px;height:6px;border-radius:50%;margin:0 1px}
</style>
</head>
<body>
<div class="wrap"><div class="top"><span class="tt"><span id="mm"></span>软糖健康日记</span><span id="sync" class="sub"></span></div>
  <div class="date"><button onclick="setDate(add(date,-1))">‹</button><input type="date" id="dt" onchange="setDate(this.value)"><button onclick="setDate(add(date,1))">›</button></div>
  <div id="main"></div>
</div>
<div class="tabs" id="tabs"></div>
<div id="login" style="display:none;position:fixed;inset:0;z-index:20;background:var(--bg);align-items:center;justify-content:center;padding:20px">
 <div class="card" style="width:100%;max-width:360px"><h3 style="font-size:18px">🍡 软糖健康日记</h3><div class="sub" style="margin-bottom:10px">登录后，记录会保存在云端，换手机也不会丢。</div>
 <input id="le" type="email" placeholder="邮箱" style="margin-bottom:8px"><input id="lp" type="password" placeholder="密码（至少 6 位）" style="margin-bottom:10px">
 <div class="row"><button class="p" onclick="doAuth('in')">登录</button><button onclick="doAuth('up')">注册</button></div>
 <button class="x" style="width:100%" onclick="$('login').style.display='none'">先不登录，只存本机</button></div></div>
<div id="toast"></div>
<script>
var db={w:{},e:[],m:{},b:[],wt:{},s:{},st:{}};
try{var s0=localStorage.getItem('health_v1');if(s0)db=Object.assign(db,JSON.parse(s0))}catch(e){}
var col=null,lastMeta='';var save=()=>{try{localStorage.setItem('health_v1',JSON.stringify(db))}catch(e){}cloudDay(date);cloudMeta()};
var $=id=>document.getElementById(id),val=id=>$(id).value.trim();
var fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
var add=(k,n)=>{var d=new Date(k+'T00:00:00');d.setDate(d.getDate()+n);return fmt(d)};
var esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
var today=fmt(new Date()),date=today,tab='h',range=7,exSel='跑步',bt='out',bcat='餐饮';
var EX={'跑步':['🏃',10],'快走':['🚶',5],'骑行':['🚴',8],'游泳':['🏊',9],'跳绳':['🪢',12],'瑜伽':['🧘',4],'力量':['🏋️',6],'篮球':['🏀',8],'爬楼梯':['🪜',9],'其他':['✨',5]};
var CO={'餐饮':'🍜','交通':'🚌','购物':'🛍️','娱乐':'🎮','居家':'🏠','医疗':'💊','其他':'✨'},CI={'工资':'💼','奖金':'🎁','理财':'📈','其他':'✨'};
var lastN=n=>Array.from({length:n},(_,i)=>add(date,i-n+1));
var wd=k=>'周'+'日一二三四五六'[new Date(k+'T00:00:00').getDay()];
var burn=k=>db.e.reduce((a,x)=>a+(x.date==k?x.kcal:0),0);
var intake=k=>{var m=db.m[k]||{};return['kb','kl','kd','ks'].reduce((a,f)=>a+(+m[f]||0),0)};
var spend=k=>db.b.reduce((a,x)=>a+(x.date==k&&x.type=='out'?x.amt:0),0);
var hasMeal=k=>{var m=db.m[k]||{};return !!(m.b||m.l||m.d||m.s)};
var has=k=>(db.st[k]&&(db.st[k].mood||db.st[k].sleep||db.st[k].note))||db.w[k]!=null||burn(k)>0||hasMeal(k)||db.b.some(x=>x.date==k)||(db.wt[k]||0)>0;
var streak=()=>{var k=has(today)?today:add(today,-1),n=0;while(has(k)){n++;k=add(k,-1)}return n};
var toastT;function toast(m){var t=$('toast');t.textContent=m;t.className='on';clearTimeout(toastT);toastT=setTimeout(()=>t.className='',1800)}
function setDate(v){if(v){date=v;render()}}
var nid=()=>Date.now()+Math.floor(Math.random()*999);
function tile(c,ic,l,v,u){return '<div class="t '+c+'"><span class="sub">'+ic+' '+l+'</span><b>'+v+'<small style="font-size:12px;font-weight:400"> '+u+'</small></b></div>'}
function bars(vals,labels){var W=340,n=vals.length,mx=Math.max(1,...vals),bw=28,gap=(W-n*bw)/(n+1);
  return '<svg viewBox="0 0 340 130">'+vals.map((v,i)=>{var x=gap+i*(bw+gap),h=v/mx*76;return '<rect class="br" x="'+x+'" y="'+(100-h)+'" width="'+bw+'" height="'+Math.max(h,2)+'" rx="9"/><text class="tl" text-anchor="middle" x="'+(x+bw/2)+'" y="'+(94-h)+'">'+(v?Math.round(v):'')+'</text><text class="tl" text-anchor="middle" x="'+(x+bw/2)+'" y="120">'+labels[i]+'</text>'}).join('')+'</svg>'}

/* 今日 */
function homeView(){
  var w=db.w[date],m=db.m[date]||{},eb=burn(date),ei=intake(date),sp=spend(date),wc=db.wt[date]||0;
  var tasks=[['⚖️','体重',w!=null,'w'],['🏃','运动',eb>0,'e'],['🍚','饮食',hasMeal(date),'m'],['💰','记账',db.b.some(x=>x.date==date),'b'],['💧','喝水',wc>=1,'m']];
  var dn=tasks.filter(t=>t[2]).length,st=streak();
  var msg=dn==5?'今天全部完成啦，超棒！🎉':dn==0?'今天也要元气满满哦～':'再完成 '+(5-dn)+' 项就全勤啦！';
  var h='<div class="banner"><div class="mas" style="font-size:40px;line-height:1">🌸</div><div><b style="font-size:17px">'+msg+'</b><div style="font-size:13px">🔥 已连续打卡 '+st+' 天</div></div></div>';
  h+='<div class="card"><h3>今日打卡 <span class="sub">'+dn+'/5</span></h3><div class="bar" style="margin-bottom:10px"><i style="width:'+dn*20+'%"></i></div><div class="chips" style="margin:0">'+tasks.map(t=>'<button class="'+(t[2]?'on':'')+'" onclick="tab=\''+t[3]+'\';render()">'+(t[2]?'✅':t[0])+' '+t[1]+'</button>').join('')+'</div></div>';
  h+='<div class="tiles">'+tile('a','⚖️','体重',w!=null?w:'--','kg')+tile('b','🔥','运动消耗',eb,'千卡')+tile('c','🍚','饮食摄入',ei,'千卡')+tile('d','💰','今日支出',sp.toFixed(1),'元')+'</div>';
  h+=statusCard();h+=badgeCard();if(ei||eb)h+='<div class="card"><h3>热量小结</h3>摄入 '+ei+' − 运动 '+eb+' = <b>'+(ei-eb)+'</b> 千卡<div class="sub">这是粗略估算，仅作参考，不含基础代谢</div></div>';
  h+='<div class="card"><h3>💾 数据备份</h3><textarea id="bk" rows="2" placeholder="点导出会生成备份文本，复制保存；换设备时粘贴后点导入"></textarea><div class="row" style="margin:8px 0 0"><button onclick="expo()">导出</button><button class="p" onclick="impo()">导入</button></div></div>';
  return h}
function expo(){$('bk').value=JSON.stringify(db);$('bk').select();toast('已生成，请复制保存')}
function impo(){try{var o=JSON.parse($('bk').value);if(!o||typeof o!='object')throw 0;db=Object.assign({w:{},e:[],m:{},b:[],wt:{},s:{},st:{}},o);save();allDays().forEach(cloudDay);render();toast('导入成功 🎉')}catch(e){toast('格式不对，导入失败')}}

/* 体重 */
function lastW(){var ks=Object.keys(db.w).filter(k=>k<=date).sort();return ks.length?db.w[ks[ks.length-1]]:null}
function weightView(){
  var cur=db.w[date],lw=lastW(),S=db.s,h=S.h>0,bmi=h&&lw?lw/Math.pow(S.h/100,2):0;
  var bl=bmi<18.5?'偏瘦':bmi<24?'正常 👍':bmi<28?'偏胖':'肥胖';
  var o='<div class="card"><h3>⚖️ 今日体重</h3><div class="row"><input id="wv" type="number" step="0.1" placeholder="输入体重 kg" value="'+(cur||'')+'"><button class="p" onclick="saveW()">保存</button></div>'+(cur!=null?'<button class="x" onclick="delW()">删除这天记录</button>':'')+'</div>';
  o+='<div class="tiles">'+tile('a','📍','当前',lw||'--','kg')+tile('b','🎯','距目标',S.g>0&&lw?Math.abs(lw-S.g).toFixed(1):'--','kg')+tile('c','📏','BMI',bmi?bmi.toFixed(1):'--',bmi?bl:'')+tile('d','🏅','历史最低',Object.keys(db.w).length?Math.min(...Object.values(db.w)):'--','kg')+'</div>';
  o+='<div class="card"><h3>📈 体重趋势</h3><div class="seg">'+[[7,'按周'],[30,'按月'],[90,'三个月']].map(r=>'<button class="'+(range==r[0]?'on':'')+'" onclick="range='+r[0]+';render()">'+r[1]+'</button>').join('')+'</div>'+chart()+'</div>';
  o+='<div class="card"><h3>🎯 我的目标</h3><div class="row"><input id="sh" type="number" placeholder="身高 cm" value="'+(S.h||'')+'"><input id="sg" type="number" step="0.1" placeholder="目标体重 kg" value="'+(S.g||'')+'"><button onclick="saveS()">保存</button></div></div>';
  return o}
function saveS(){db.s.h=+val('sh')||0;db.s.g=+val('sg')||0;save();render();toast('已保存 ✨')}
function saveW(){var v=parseFloat($('wv').value);if(!(v>0))return;var ks=Object.keys(db.w).filter(k=>k<date).sort(),p=ks.length?db.w[ks[ks.length-1]]:null;
  db.w[date]=v;save();render();toast(p==null?'第一次记录，好的开始 🌸':v<p?'比上次轻了 '+(p-v).toFixed(1)+'kg 🎉':v>p?'比上次重了 '+(v-p).toFixed(1)+'kg，没关系～':'和上次一样稳 ✨')}
function delW(){delete db.w[date];save();render()}
function chart(){
  var days=lastN(range),pts=[];days.forEach((k,i)=>{if(db.w[k]!=null)pts.push({i:i,k:k,v:db.w[k]})});
  if(!pts.length)return '<div class="sub" style="text-align:center;padding:20px">还没有记录，快来称一下吧 🐾</div>';
  var vs=pts.map(p=>p.v),g=db.s.g>0?db.s.g:null,all=g?vs.concat(g):vs,mn=Math.min(...all)-.5,mx=Math.max(...all)+.5;
  var W=340,H=190,L=34,R=10,T=14,B=24,n=days.length,X=i=>L+i*(W-L-R)/(n-1),Y=v=>T+(mx-v)*(H-T-B)/(mx-mn),s='';
  for(var j=0;j<=3;j++){var y=Y(mn+(mx-mn)*j/3);s+='<line class="gr" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="tl" x="2" y="'+(y+3)+'">'+(mn+(mx-mn)*j/3).toFixed(1)+'</text>'}
  var st=range==7?1:range==30?5:15;
  days.forEach((k,i)=>{if(i%st==0||i==n-1)s+='<text class="tl" text-anchor="middle" x="'+X(i)+'" y="'+(H-6)+'">'+k.slice(5).replace('-','/')+'</text>'});
  if(g)s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(g)+'" y2="'+Y(g)+'"/><text class="tl" style="fill:var(--grn)" x="'+(W-R)+'" y="'+(Y(g)-4)+'" text-anchor="end">目标 '+g+'</text>';
  s+='<path class="ln" d="'+pts.map((p,q)=>(q?'L':'M')+X(p.i)+' '+Y(p.v)).join(' ')+'"/>'+pts.map(p=>'<circle class="dt" cx="'+X(p.i)+'" cy="'+Y(p.v)+'" r="4"><title>'+p.k+'：'+p.v+'kg</title></circle>'+(range==7?'<text class="tl" text-anchor="middle" x="'+X(p.i)+'" y="'+(Y(p.v)-9)+'">'+p.v+'</text>':'')).join('');
  var d=pts[pts.length-1].v-pts[0].v;
  return '<svg viewBox="0 0 '+W+' '+H+'">'+s+'</svg><div class="sub">共 '+pts.length+' 次记录'+(pts.length>1?'，期间 '+(d>0?'+':'')+d.toFixed(1)+' kg':'')+'</div>'}

/* 运动 */
function exView(){
  var list=db.e.filter(x=>x.date==date),tot=burn(date),agg={},tm=0,tk=0;
  db.e.forEach(x=>{var a=agg[x.name]||(agg[x.name]={c:0,m:0,k:0});a.c++;a.m+=x.min;a.k+=x.kcal;tm+=x.min;tk+=x.kcal});
  var ks=Object.keys(agg).sort((a,b)=>agg[b].c-agg[a].c),mc=ks.length?agg[ks[0]].c:1;
