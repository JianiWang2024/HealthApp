<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1a1d;--card:#2a2327;--tx:#f3e7ea;--sub:#b5a2a9;--ac2:#41303a;--bd:#3f3238;--red:#ff8095;--grn:#5fd3a6;color-scheme:dark}}

.date input{width:auto;border:0;background:var(--card);border-radius:18px;padding:6px 14px;font-weight:700;text-align:center}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px}
h3{margin:0 0 10px;font-size:15px}
button,input,select,textarea{font:inherit;color:var(--tx)}
button{border:1.5px solid var(--bd);background:var(--card);border-radius:999px;padding:7px 14px;cursor:pointer}
button:active{transform:scale(.96)}
button.p{background:var(--ac);border-color:var(--ac);color:#5a3a44;font-weight:700}
input,select,textarea{width:100%;border:1.5px solid var(--bd);background:var(--bg);border-radius:12px;padding:8px 12px;min-width:0}
textarea{resize:vertical}
.row{display:flex;gap:8px;margin-bottom:8px;align-items:center}.row>*{flex:1}.row>button{flex:none}
.seg{display:flex;background:var(--ac2);border-radius:999px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:5px}.seg button.on{background:var(--card);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chips button{padding:5px 12px}.chips button.on{background:var(--ac2);border-color:var(--ac);font-weight:700}
.item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}.item:first-of-type{border-top:0}
.sub{color:var(--sub);font-size:13px}.x{border:0;background:none;color:var(--sub);padding:2px 8px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.tiles.g2{grid-template-columns:1fr 1fr}
.t{background:var(--ac2);border-radius:16px;padding:10px;text-align:center}.t b{display:block;font-size:22px;line-height:1.3}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.wk button{display:flex;flex-direction:column;align-items:center;padding:6px 0;border-radius:14px;line-height:1.3;min-width:0}
.wk button.done{background:var(--ac2)}.wk button.cur{border-color:var(--ac);border-width:2px}.wk .th{font-size:14px;height:18px}
.bar{height:10px;background:var(--ac2);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:496px;margin:0 auto;display:flex;background:var(--card);border:1.5px solid var(--bd);border-radius:999px;padding:4px}
.tabs button{flex:1;border:0;background:none;padding:6px 0;color:var(--sub);font-size:11px}.tabs button b{display:block;font-size:19px;font-weight:400}.tabs button.on{background:var(--ac2);color:var(--tx);font-weight:700}
svg{width:100%;height:auto;display:block}
.ln{fill:none;stroke:var(--ac);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.dt{fill:var(--card);stroke:var(--ac);stroke-width:2.5}.gl{stroke:var(--grn);stroke-dasharray:5 4}.gr{stroke:var(--bd)}.tl{fill:var(--sub);font-size:10px}
.out{color:var(--red)}.inc{color:var(--grn)}
.cmp{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;gap:8px 6px;align-items:center;font-size:14px}.cmp>*{text-align:right}.cmp>*:nth-child(4n+1){text-align:left}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9;white-space:nowrap}#toast.on{opacity:1}
#login{display:none;position:fixed;inset:0;z-index:20;background:var(--bg);align-items:center;justify-content:center;padding:20px}
</style>

<script>
var SB_URL='https://kxhfoesmrapqcpkcschn.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4aGZvZXNtcmFwcWNwa2NzY2huIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxNzQ0NjAsImV4cCI6MjEwODc1MDQ2MH0.Y0riwggcJHnun5XxaTWSxSHmHJju7hFmQBltWimVet4';
var db={w:{},e:[],m:{},b:[],wt:{},s:{},st:{}},col=null,lastMeta='',sb=null,uid=null;
try{var s0=localStorage.getItem('health_v1');if(s0)db=Object.assign(db,JSON.parse(s0))}catch(e){}
var $=id=>document.getElementById(id),val=id=>$(id).value.trim();
var fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
var add=(k,n)=>{var d=new Date(k+'T00:00:00');d.setDate(d.getDate()+n);return fmt(d)};
var esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
var nid=()=>Date.now()+Math.floor(Math.random()*999);
var today=fmt(new Date()),date=today,tab='h',range=7,kind='c',cSel='跑步',part='胸',sSel='坐姿推胸',bt='out',bcat='餐饮';
function save(){try{localStorage.setItem('health_v1',JSON.stringify(db))}catch(e){}cloudDay(date);cloudMeta()}
var tmr;function toast(m){var t=$('toast');t.textContent=m;t.className='on';clearTimeout(tmr);tmr=setTimeout(()=>t.className='',1800)}
function setDate(v){if(v){date=v;render()}}
function go(t){tab=t;render();scrollTo(0,0)}
function setPart(p){part=p;sSel=STR[p][0];render()}
function setKind(k){kind=k;render()}
function setRange(n){range=n;render()}
function setBt(t){bt=t;bcat=t=='out'?'餐饮':'工资';render()}
function setCat(c,el){bcat=c;sel(el)}
function sel(el){el.parentNode.querySelectorAll('button').forEach(b=>b.className='');el.className='on'}
var lastN=n=>Array.from({length:n},(_,i)=>add(date,i-n+1));
var burn=k=>db.e.reduce((a,x)=>a+(x.date==k?x.kcal:0),0);
var intake=k=>{var m=db.m[k]||{};return['kb','kl','kd','ks'].reduce((a,f)=>a+(+m[f]||0),0)};
var spend=k=>db.b.reduce((a,x)=>a+(x.date==k&&x.type=='out'?x.amt:0),0);
var hasMeal=k=>{var m=db.m[k]||{};return !!(m.b||m.l||m.d||m.s)};
var tile=(l,v,u)=>'<div class="t"><span class="sub">'+l+'</span><b>'+v+'</b><span class="sub">'+u+'</span></div>';

/* 今日 */
function homeView(){
  var w=db.w[date],eb=burn(date),ei=intake(date),sp=spend(date);
  var dn=[['体重',w!=null,'w'],['饮食',hasMeal(date),'m'],['健身',eb>0,'e'],['记账',db.b.some(x=>x.date==date),'b']];
  return '<div class="card"><h3>今日打卡 <span class="sub">'+dn.filter(x=>x[1]).length+'/4</span></h3><div class="chips" style="margin:0">'+dn.map(x=>'<button class="'+(x[1]?'on':'')+'" onclick="go(\''+x[2]+'\')">'+(x[1]?'✓ ':'')+x[0]+'</button>').join('')+'</div></div>'
  +'<div class="tiles g2">'+tile('体重',w!=null?w:'--','kg')+tile('运动消耗',eb,'千卡')+tile('饮食摄入',ei,'千卡')+tile('今日支出',sp.toFixed(1),'元')+'</div>'
  +(ei||eb?'<div class="card"><h3>热量小结</h3>摄入 '+ei+' − 运动 '+eb+' = <b>'+(ei-eb)+'</b> 千卡<div class="sub">只算了运动消耗，不含基础代谢</div></div>':'')
  +'<div class="sub" style="text-align:center">'+(col?'已登录，数据自动同步 <button class="x" onclick="logout()">退出登录</button>':sb?'未登录，数据只存本机 <button class="x" onclick="showLogin()">去登录</button>':'数据只存本机')+'</div>'}

/* 体重 */
function lastW(){var ks=Object.keys(db.w).filter(k=>k<=date).sort();return ks.length?db.w[ks[ks.length-1]]:null}
function weightView(){
  var cur=db.w[date],lw=lastW(),S=db.s,bmi=S.h>0&&lw?lw/Math.pow(S.h/100,2):0,bl=bmi<18.5?'偏瘦':bmi<24?'正常':bmi<28?'偏胖':'肥胖';
  return '<div class="card"><h3>今日体重</h3><div class="row"><input id="wv" type="number" step="0.1" placeholder="体重 kg" value="'+(cur||'')+'"><button class="p" onclick="saveW()">保存</button></div>'+(cur!=null?'<button class="x" onclick="delW()">删除这天记录</button>':'')+'</div>'
  +'<div class="tiles">'+tile('当前',lw||'--','kg')+tile('距目标',S.g>0&&lw?Math.abs(lw-S.g).toFixed(1):'--','kg')+tile('BMI',bmi?bmi.toFixed(1):'--',bmi?bl:'')+'</div>'
  +'<div class="card"><h3>体重趋势</h3><div class="seg">'+[[7,'按周'],[30,'按月'],[90,'三个月']].map(r=>'<button class="'+(range==r[0]?'on':'')+'" onclick="setRange('+r[0]+')">'+r[1]+'</button>').join('')+'</div>'+chart()+'</div>'
  +'<div class="card"><h3>我的资料</h3><div class="sub" style="margin-bottom:8px">用来更准确地估算运动消耗</div><div class="row"><select id="ssx"><option value="">性别</option><option'+(S.sex=='女'?' selected':'')+'>女</option><option'+(S.sex=='男'?' selected':'')+'>男</option></select><input id="sag" type="number" placeholder="年龄" value="'+(S.age||'')+'"></div><div class="row"><input id="sh" type="number" placeholder="身高 cm" value="'+(S.h||'')+'"><input id="sg" type="number" step="0.1" placeholder="目标体重 kg" value="'+(S.g||'')+'"></div><button class="p" style="width:100%" onclick="saveS()">保存资料</button></div>'}
function saveS(){var S=db.s;S.sex=$('ssx').value;S.age=+val('sag')||0;S.h=+val('sh')||0;S.g=+val('sg')||0;save();render();toast('已保存')}
function saveW(){var v=parseFloat($('wv').value);if(!(v>0))return;var ks=Object.keys(db.w).filter(k=>k<date).sort(),p=ks.length?db.w[ks[ks.length-1]]:null;
  db.w[date]=v;save();render();toast(p==null?'第一次记录，好的开始':v<p?'比上次轻了 '+(p-v).toFixed(1)+'kg':v>p?'比上次重了 '+(v-p).toFixed(1)+'kg':'和上次一样')}
function delW(){delete db.w[date];save();render()}
function chart(){
  var days=lastN(range),pts=[];days.forEach((k,i)=>{if(db.w[k]!=null)pts.push({i:i,k:k,v:db.w[k]})});
  if(!pts.length)return '<div class="sub" style="text-align:center;padding:20px">这段时间还没有体重记录</div>';
  var vs=pts.map(p=>p.v),g=db.s.g>0?db.s.g:null,all=g?vs.concat(g):vs,mn=Math.min(...all)-.5,mx=Math.max(...all)+.5;
  var W=340,H=190,L=34,R=10,T=14,B=24,n=days.length,X=i=>L+i*(W-L-R)/(n-1),Y=v=>T+(mx-v)*(H-T-B)/(mx-mn),s='';
  for(var j=0;j<=3;j++){var y=Y(mn+(mx-mn)*j/3);s+='<line class="gr" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="tl" x="2" y="'+(y+3)+'">'+(mn+(mx-mn)*j/3).toFixed(1)+'</text>'}
  var st=range==7?1:range==30?5:15;
  days.forEach((k,i)=>{if(i%st==0||i==n-1)s+='<text class="tl" text-anchor="middle" x="'+X(i)+'" y="'+(H-6)+'">'+k.slice(5).replace('-','/')+'</text>'});
  if(g)s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(g)+'" y2="'+Y(g)+'"/><text class="tl" style="fill:var(--grn)" x="'+(W-R)+'" y="'+(Y(g)-4)+'" text-anchor="end">目标 '+g+'</text>';
  s+='<path class="ln" d="'+pts.map((p,q)=>(q?'L':'M')+X(p.i)+' '+Y(p.v)).join(' ')+'"/>'+pts.map(p=>'<circle class="dt" cx="'+X(p.i)+'" cy="'+Y(p.v)+'" r="4"><title>'+p.k+'：'+p.v+'kg</title></circle>'+(range==7?'<text class="tl" text-anchor="middle" x="'+X(p.i)+'" y="'+(Y(p.v)-9)+'">'+p.v+'</text>':'')).join('');
  var d=pts[pts.length-1].v-pts[0].v;
  return '<svg viewBox="0 0 '+W+' '+H+'">'+s+'</svg><div class="sub">共 '+pts.length+' 次记录'+(pts.length>1?'，期间 '+(d>0?'+':'')+d.toFixed(1)+' kg':'')+'</div>'}

/* 饮食 */
function mealView(){
  var m=db.m[date]||{};
  return [['b','早餐'],['l','午餐'],['d','晚餐']].map(r=>'<div class="card"><h3>'+r[1]+'</h3><textarea id="m_'+r[0]+'" rows="2" placeholder="吃了什么？">'+esc(m[r[0]]||'')+'</textarea><input id="k_'+r[0]+'" type="number" style="margin-top:8px" placeholder="大约多少千卡（可选）" value="'+(m['k'+r[0]]||'')+'"></div>').join('')
  +'<button class="p" style="width:100%" onclick="saveM()">保存（今日共 '+intake(date)+' 千卡）</button>'}
function saveM(){var o={};['b','l','d'].forEach(f=>{o[f]=val('m_'+f);o['k'+f]=+val('k_'+f)||0});db.m[date]=Object.assign({},db.m[date],o);save();render();toast('已保存')}

/* 健身：有氧 + 力量 */
var CARDIO={'跑步':['🏃',9],'快走':['🚶',4.5],'骑行':['🚴',7.5],'游泳':['🏊',7],'跳绳':['🪢',11],'椭圆机':['🌀',5],'划船机':['🚣',7],'爬楼梯':['🪜',8],'HIIT':['⚡',8],'瑜伽':['🧘',2.5],'篮球':['🏀',6.5]};
var STR={
'胸':['坐姿推胸机','杠铃卧推','哑铃卧推','上斜哑铃推举','上斜推胸机','史密斯卧推','蝴蝶机夹胸','绳索夹胸','双杠臂屈伸','俯卧撑'],
'肩背':['坐姿划船机','高位下拉','窄握下拉','哑铃单臂划船','T杠划船','杠铃俯身划船','辅助引体向上','直臂下压','坐姿推肩机','哑铃肩推','侧平举','面拉','反向蝴蝶机','耸肩'],
'臀腿':['哈克深蹲','坐姿腿举','45°倒蹬','杠铃深蹲','史密斯深蹲','高脚杯深蹲','坐姿腿屈伸','俯卧腿弯举','坐姿腿弯举','罗马尼亚硬拉','杠铃臀推','臀桥','保加利亚分腿蹲','哑铃弓步','坐姿髋外展','坐姿髋内收','绳索后踢腿','站姿提踵'],
'手臂':['哑铃弯举','杠铃弯举','牧师凳弯举','锤式弯举','绳索弯举','绳索下压','仰卧臂屈伸','颈后臂屈伸','坐姿臂屈伸机','反握弯举'],
'核心':['平板支撑','卷腹','悬垂举腿','腹肌轮','俄罗斯转体','罗马椅挺身']};
var INT={'轻松':3.5,'适中':5,'吃力':6};
var bw=()=>lastW()||60;
/* 活动千卡 =（MET−1）×体重×小时，与手表的“活动能量”口径一致；有心率+性别年龄时改用心率公式 */
function cKcal(name,min,hr){var kg=bw(),S=db.s;
  if(hr>0&&S.age>0&&S.sex){var g=(S.sex=='男'?-55.0969+0.6309*hr+0.1988*kg+0.2017*S.age:-20.4022+0.4472*hr-0.1263*kg+0.074*S.age)/4.184*min;return Math.max(0,Math.round(g-kg*min/60))}
  return Math.max(0,Math.round((CARDIO[name][1]-1)*kg*min/60))}
var sTime=(s,r)=>s*(r*3+75)/60;
var sKcal=(s,r,lv)=>Math.round((INT[lv]-1)*bw()*sTime(s,r)/60);
function weekStrip(){
  var dow=(new Date(date+'T00:00:00').getDay()+6)%7,st=add(date,-dow),dn=0;
  var cells=Array.from({length:7},(_,i)=>add(st,i)).map((k,i)=>{var l=db.e.filter(x=>x.date==k),n=l.length;if(n)dn++;
    var ic=(l.some(x=>x.kind!='s')?'🏃':'')+(l.some(x=>x.kind=='s')?'🏋️':'');
    return '<button class="'+(n?'done ':'')+(k==date?'cur':'')+'" onclick="setDate(\''+k+'\')"><span class="sub">'+'一二三四五六日'[i]+'</span><b>'+k.slice(8)+'</b><span class="th">'+(ic||'·')+'</span><span class="sub">'+(n?burn(k):'')+'</span></button>'}).join('');
  return '<div class="card"><h3>本周打卡 <span class="sub">'+dn+' 天</span><span style="float:right"><button class="x" onclick="setDate(add(date,-7))">‹ 上周</button><button class="x" onclick="setDate(add(date,7))">下周 ›</button></span></h3><div class="wk">'+cells+'</div></div>'}
function addCard(){
  var h='<div class="card"><div class="seg"><button class="'+(kind=='c'?'on':'')+'" onclick="setKind(\'c\')">有氧</button><button class="'+(kind=='s'?'on':'')+'" onclick="setKind(\'s\')">力量</button></div>';
  if(kind=='c')h+='<div class="chips">'+Object.keys(CARDIO).map(k=>'<button class="'+(k==cSel?'on':'')+'" onclick="pick(this,\'c\',\''+k+'\')">'+CARDIO[k][0]+' '+k+'</button>').join('')+'</div><div class="sub" id="lc" style="margin:-2px 0 6px">'+cHint(cSel)+'</div><div class="row"><input id="cm" type="number" placeholder="时长（分钟）" oninput="calc()"><input id="ch" type="number" placeholder="平均心率（可选）" oninput="calc()"></div>';
  else h+=quickRow()+'<div class="chips">'+Object.keys(STR).map(p=>'<button class="'+(p==part?'on':'')+'" onclick="setPart(\''+p+'\')">'+p+'</button>').join('')+'</div><div class="sub" style="margin:-2px 0 6px">'+part+'：选择动作或器械 <span id="lh" style="margin-left:6px">'+lastHint(sSel)+'</span></div><div class="chips">'+STR[part].map(k=>'<button class="'+(k==sSel?'on':'')+'" onclick="pick(this,\'s\',\''+k+'\')">'+k+'</button>').join('')+'</div><input id="sn" placeholder="或输入其他动作名称" style="margin-bottom:8px">'
    +'<div class="row"><input id="sw" type="number" step="0.5" placeholder="重量 kg" oninput="calc()"><input id="ss" type="number" placeholder="组数" oninput="calc()"><input id="sr" type="number" placeholder="每组次数" oninput="calc()"></div><div class="row"><span class="sub" style="flex:none">强度</span><select id="si" onchange="calc()">'+Object.keys(INT).map(k=>'<option'+(k=='适中'?' selected':'')+'>'+k+'</option>').join('')+'</select></div>';
  return h+'<div class="row"><input id="ek" type="number" placeholder="千卡（自动估算，可改）"><button class="p" onclick="addE()">添加</button></div><div class="sub">按体重 '+bw()+' kg 估算'+(lastW()?'':'（先在体重页记录体重会更准）')+'。有手表的话，把「健身」App 里的活动千卡直接填进去；有氧填了平均心率，并在体重页填过性别和年龄，会改用心率公式。</div></div>'}
function pick(el,t,k){if(t=='c'){cSel=k;$('lc').textContent=cHint(k);cFill(k)}else{sSel=k;$('sn').value='';$('lh').textContent=lastHint(k);fill(k)}sel(el);calc()}
/* ===== 有氧：常做运动 + 上次记录 ===== */
function lastC(n){return db.e.filter(x=>x.kind!='s'&&x.name==n).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).pop()}
function cHint(n){var l=lastC(n);return l?'上次 '+l.date.slice(5)+'：'+l.min+' 分钟'+(l.hr?' · 心率 '+l.hr:'')+' · '+l.kcal+' 千卡':'还没做过这个运动'}
function cFill(n){var l=lastC(n);if(l){$('cm').value=l.min;$('ch').value=l.hr||''}calc()}
function freqC(){var m={};db.e.forEach(x=>{if(x.kind!='s'&&CARDIO[x.name]){var a=m[x.name]||(m[x.name]={name:x.name,n:0,d:''});a.n++;if(x.date>a.d)a.d=x.date}});return Object.values(m).sort((a,b)=>b.n-a.n||(a.d<b.d?1:-1)).slice(0,5)}
function cQuick(){var f=freqC();if(!f.length)return '';return '<div class="sub" style="margin-bottom:6px">常做的运动</div><div class="chips">'+f.map((x,i)=>'<button class="'+(x.name==cSel?'on':'')+'" onclick="cq('+i+')">'+CARDIO[x.name][0]+' '+x.name+' <span class="sub">'+x.n+'次</span></button>').join('')+'</div>'}
function cq(i){var f=freqC()[i];if(!f)return;cSel=f.name;render();cFill(f.name)}
/* ===== 常做动作 + 上次记录 ===== */
function lastRec(n){return db.e.filter(x=>x.kind=='s'&&x.name==n).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).pop()}
function lastHint(n){var l=lastRec(n);return l?'上次 '+l.date.slice(5)+'：'+(l.w?l.w+'kg × ':'')+l.sets+' 组 × '+l.reps+' 次':'还没做过这个动作'}
function fill(n){var l=lastRec(n);if(l){$('sw').value=l.w||'';$('ss').value=l.sets;$('sr').value=l.reps}calc()}
function freqStr(){var m={};db.e.forEach(x=>{if(x.kind=='s'){var a=m[x.name]||(m[x.name]={name:x.name,part:x.part,n:0,d:''});a.n++;if(x.date>=a.d){a.d=x.date;a.part=x.part||a.part}}});return Object.values(m).sort((a,b)=>b.n-a.n||(a.d<b.d?1:-1)).slice(0,6)}
function quickRow(){var f=freqStr();if(!f.length)return '';return '<div class="sub" style="margin-bottom:6px">常做的动作</div><div class="chips">'+f.map((x,i)=>'<button class="'+(x.name==sSel?'on':'')+'" onclick="quick('+i+')">'+esc(x.name)+' <span class="sub">'+x.n+'次</span></button>').join('')+'</div>'}
function quick(i){var f=freqStr()[i];if(!f)return;if(STR[f.part])part=f.part;sSel=f.name;render();if(!(STR[part]||[]).includes(f.name))$('sn').value=f.name;fill(f.name)}
function calc(){var k='';
  if(kind=='c'){var m=+$('cm').value;if(m>0)k=cKcal(cSel,m,+$('ch').value)}
  else{var s=+$('ss').value,r=+$('sr').value;if(s>0&&r>0)k=sKcal(s,r,$('si').value)}
  $('ek').value=k}
function addE(){var kc=$('ek').value,o={id:nid(),date:date};
  if(kind=='c'){var m=+$('cm').value,hr=+$('ch').value;if(!(m>0))return;Object.assign(o,{kind:'c',name:cSel,min:m,kcal:kc!==''?+kc:cKcal(cSel,m,hr)});if(hr>0)o.hr=hr}
  else{var s=+$('ss').value,r=+$('sr').value;if(!(s>0&&r>0))return;Object.assign(o,{kind:'s',part:part,name:val('sn')||sSel,w:+$('sw').value||0,sets:s,reps:r,min:Math.round(sTime(s,r)),kcal:kc!==''?+kc:sKcal(s,r,$('si').value)})}
  db.e.push(o);save();render();toast('已记录 '+o.kcal+' 千卡')}
function delE(id){db.e=db.e.filter(x=>x.id!=id);save();render()}
function recLine(x){var del='<button class="x" onclick="delE('+x.id+')">✕</button>';
  return x.kind=='s'?'<div class="item"><div><b>'+esc(x.name)+'</b><div class="sub">'+esc(x.part||'')+' · '+(x.w?x.w+'kg × ':'')+x.sets+' 组 × '+x.reps+' 次</div></div><div><b>'+x.kcal+'</b> 千卡'+del+'</div></div>'
   :'<div class="item"><div><b>'+(CARDIO[x.name]||['✨'])[0]+' '+esc(x.name)+'</b><div class="sub">'+x.min+' 分钟'+(x.hr?' · 心率 '+x.hr:'')+'</div></div><div><b>'+x.kcal+'</b> 千卡'+del+'</div></div>'}
function exView(){
  var list=db.e.filter(x=>x.date==date),c={},s={};
  db.e.forEach(x=>{if(x.kind=='s'){var a=s[x.name]||(s[x.name]={c:0,b:0,v:0});a.c++;a.b=Math.max(a.b,x.w||0);a.v+=(x.w||0)*x.sets*x.reps}else{var a=c[x.name]||(c[x.name]={c:0,m:0,k:0});a.c++;a.m+=x.min;a.k+=x.kcal}});
  var cs=Object.keys(c).sort((a,b)=>c[b].c-c[a].c),ss=Object.keys(s).sort((a,b)=>s[b].c-s[a].c);
  return weekStrip()+addCard()
   +'<div class="card"><h3>今日记录 <span class="sub">消耗 <b class="inc">'+burn(date)+'</b> 千卡</span></h3>'+(list.length?list.map(recLine).join(''):'<div class="sub" style="text-align:center;padding:10px">今天还没有运动记录</div>')+'</div>'
   +'<div class="card"><h3>累计 · 有氧</h3>'+(cs.length?cs.map(k=>'<div class="item"><span>'+((CARDIO[k]||['✨'])[0])+' '+esc(k)+'</span><span class="sub"><b style="color:var(--tx)">'+c[k].c+'</b> 次 · '+c[k].m+' 分钟 · '+c[k].k+' 千卡</span></div>').join(''):'<div class="sub">暂无数据</div>')+'</div>'
   +'<div class="card"><h3>累计 · 力量</h3>'+(ss.length?ss.map(k=>'<div class="item"><span>'+esc(k)+'</span><span class="sub"><b style="color:var(--tx)">'+s[k].c+'</b> 次 · 最大 '+s[k].b+'kg · 总容量 '+s[k].v+'kg</span></div>').join(''):'<div class="sub">暂无数据</div>')+'</div>'}

/* 记账 */
var CO=['餐饮','交通','购物','娱乐','居家','医疗','其他'],CI=['工资','奖金','理财','其他'];
var PC=['#f4a3b9','#9fd3f0','#ffd98a','#a8e0c3','#c7b5ec','#ffb88a','#cfc4c8'];
function addM(k,n){var d=new Date(k+'T00:00:00'),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return fmt(d)}
function catSum(mo){var c={},t=0;db.b.forEach(x=>{if(x.type=='out'&&x.date.slice(0,7)==mo){c[x.cat]=(c[x.cat]||0)+x.amt;t+=x.amt}});return{c:c,t:t}}
function chg(c,p){if(!(p>0))return c>0?'<span class="sub">新增</span>':'<span class="sub">—</span>';var d=(c-p)/p*100;return '<span class="'+(d>0?'out':d<0?'inc':'sub')+'">'+(d>0?'▲':d<0?'▼':'')+Math.abs(d).toFixed(0)+'%</span>'}
function pie(items,tot){var R=74,a0=-Math.PI/2,s='';
  items.forEach((x,i)=>{var a1=a0+x[1]/tot*2*Math.PI,c=PC[i%PC.length];
    if(items.length==1)s+='<circle cx="80" cy="80" r="'+R+'" fill="'+c+'"/>';
    else s+='<path d="M80 80L'+(80+R*Math.cos(a0)).toFixed(2)+' '+(80+R*Math.sin(a0)).toFixed(2)+'A'+R+' '+R+' 0 '+(a1-a0>Math.PI?1:0)+' 1 '+(80+R*Math.cos(a1)).toFixed(2)+' '+(80+R*Math.sin(a1)).toFixed(2)+'Z" fill="'+c+'" stroke="var(--card)" stroke-width="2"><title>'+esc(x[0])+' '+x[1].toFixed(2)+'</title></path>';
    a0=a1});
  return '<svg viewBox="0 0 160 160" style="width:150px;height:150px;flex:none">'+s+'<circle cx="80" cy="80" r="38" fill="var(--card)"/><text x="80" y="76" text-anchor="middle" class="tl">支出</text><text x="80" y="94" text-anchor="middle" style="fill:var(--tx);font-size:15px;font-weight:700">'+tot.toFixed(0)+'</text></svg>'}
function billView(){
  var cats=bt=='out'?CO:CI,day=db.b.filter(x=>x.date==date),mo=date.slice(0,7),y=+mo.slice(0,4),mn=+mo.slice(5),mi=0;
  var cur=catSum(mo),pm=catSum(addM(date,-1).slice(0,7)),py=catSum((y-1)+mo.slice(4));
  db.b.forEach(x=>{if(x.type=='in'&&x.date.slice(0,7)==mo)mi+=x.amt});
  var h='<div class="tiles">'+tile('今日支出',spend(date).toFixed(1),'元')+tile('本月支出',cur.t.toFixed(0),'元')+tile('本月收入',mi.toFixed(0),'元')+'</div>';
  h+='<div class="card"><div class="seg"><button class="'+(bt=='out'?'on':'')+'" onclick="setBt(\'out\')">支出</button><button class="'+(bt=='in'?'on':'')+'" onclick="setBt(\'in\')">收入</button></div><div class="chips">'+cats.map(c=>'<button class="'+(c==bcat?'on':'')+'" onclick="setCat(\''+c+'\',this)">'+c+'</button>').join('')+'</div><div class="row"><input id="ba" type="number" step="0.01" placeholder="金额"><input id="bn" placeholder="备注（可选）"><button class="p" onclick="addB()">记一笔</button></div></div>';
  h+='<div class="card"><h3>今日账单</h3>'+(day.length?day.map(x=>'<div class="item"><div>'+esc(x.cat)+'<div class="sub">'+esc(x.note||'')+'</div></div><div><b class="'+(x.type=='out'?'out':'inc')+'">'+(x.type=='out'?'-':'+')+x.amt.toFixed(2)+'</b><button class="x" onclick="delB('+x.id+')">✕</button></div></div>').join(''):'<div class="sub" style="text-align:center;padding:10px">今天还没记账</div>')+'</div>';
  var ks=Object.keys(cur.c).sort((a,b)=>cur.c[b]-cur.c[a]);
  h+='<div class="card"><h3>支出分布</h3><div class="row"><button onclick="setDate(addM(date,-1))">‹</button><b style="text-align:center">'+y+' 年 '+mn+' 月</b><button onclick="setDate(addM(date,1))">›</button></div>'
   +(ks.length?'<div style="display:flex;align-items:center;gap:12px">'+pie(ks.map(k=>[k,cur.c[k]]),cur.t)+'<div style="flex:1;min-width:0">'+ks.map((k,i)=>'<div style="display:flex;align-items:center;gap:6px;margin:3px 0"><i style="width:10px;height:10px;border-radius:50%;flex:none;background:'+PC[i%PC.length]+'"></i><span style="flex:1">'+esc(k)+'</span><span class="sub">'+(cur.c[k]/cur.t*100).toFixed(0)+'%</span></div>').join('')+'</div></div>':'<div class="sub" style="text-align:center;padding:16px">这个月还没有支出记录</div>')+'</div>';
  var all=[...new Set([...Object.keys(cur.c),...Object.keys(pm.c),...Object.keys(py.c)])].sort((a,b)=>(cur.c[b]||0)-(cur.c[a]||0));
  h+='<div class="card"><h3>支出对比</h3><div class="cmp"><span class="sub">分类</span><span class="sub">本月</span><span class="sub">环比</span><span class="sub">同比</span><b>总支出</b><b>'+cur.t.toFixed(0)+'</b><b>'+chg(cur.t,pm.t)+'</b><b>'+chg(cur.t,py.t)+'</b>'
   +all.map(k=>'<span>'+esc(k)+'</span><span>'+(cur.c[k]||0).toFixed(0)+'</span><span>'+chg(cur.c[k]||0,pm.c[k])+'</span><span>'+chg(cur.c[k]||0,py.c[k])+'</span>').join('')
   +'</div><div class="sub" style="margin-top:8px">环比：对比上个月（'+pm.t.toFixed(0)+' 元）；同比：对比去年同月（'+py.t.toFixed(0)+' 元）。▲ 表示花得更多，▼ 表示更少。</div></div>';
  return h}
function addB(){var a=parseFloat($('ba').value);if(!(a>0))return;db.b.push({id:nid(),date:date,type:bt,cat:bcat,amt:a,note:val('bn')});save();render();toast('已记录')}
function delB(id){db.b=db.b.filter(x=>x.id!=id);save();render()}

function render(){
  $('dt').value=date;
  $('main').innerHTML={h:homeView,w:weightView,m:mealView,e:exView,b:billView}[tab]();
  $('tabs').innerHTML=[['h','🏠','今日'],['w','⚖️','体重'],['m','🍚','饮食'],['e','🏋️','健身'],['b','💰','记账']].map(t=>'<button class="'+(tab==t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')"><b>'+t[1]+'</b>'+t[2]+'</button>').join('')}

/* 云端同步：每天一份数据，仅本人可见 */
function setSync(s){var e=$('sync');if(e)e.textContent={ok:'已同步',err:'同步失败，已存本机',loc:'仅存本机',ing:'同步中…'}[s]||''}
function allDays(){return[...new Set([...Object.keys(db.w),...Object.keys(db.m),...Object.keys(db.wt),...Object.keys(db.st),...db.e.map(x=>x.date),...db.b.map(x=>x.date)])]}
var strip=x=>{var o=Object.assign({},x);delete o.date;return o};
function dayOf(k){return{w:db.w[k]!=null?db.w[k]:null,e:db.e.filter(x=>x.date==k).map(strip),m:db.m[k]||{},b:db.b.filter(x=>x.date==k).map(strip),wt:db.wt[k]||0,st:db.st[k]||{}}}
function applyDay(k,d){delete db.w[k];delete db.m[k];delete db.wt[k];delete db.st[k];db.e=db.e.filter(x=>x.date!=k);db.b=db.b.filter(x=>x.date!=k);
  if(d.w!=null)db.w[k]=d.w;if(d.m&&Object.keys(d.m).length)db.m[k]=d.m;if(d.wt)db.wt[k]=d.wt;if(d.st&&Object.keys(d.st).length)db.st[k]=d.st;
  (d.e||[]).forEach(x=>db.e.push(Object.assign({date:k},x)));(d.b||[]).forEach(x=>db.b.push(Object.assign({date:k},x)))}
function cloudDay(k){if(!col)return;var d=dayOf(k),empty=d.w==null&&!d.e.length&&!hasMeal(k)&&!d.b.length&&!d.wt&&!Object.keys(d.st).length;
  setSync('ing');var q=empty?sb.from('days').delete().eq('user_id',uid).eq('day',k):sb.from('days').upsert({user_id:uid,day:k,data:d});
  q.then(r=>setSync(r.error?'err':'ok'),()=>setSync('err'))}
function cloudMeta(){if(!col)return;var s=JSON.stringify(db.s);if(s=='{}'||s==lastMeta)return;lastMeta=s;sb.from('meta').upsert({user_id:uid,data:db.s}).then(r=>{if(r.error)setSync('err')})}
function showLogin(){$('login').style.display='flex'}
function lerr(m){$('lerr').textContent=m||''}
var AUTHERR=[['invalid login credentials','密码错误，或这个邮箱还没注册。请检查密码；还没注册的话请点「注册」'],['already registered','这个邮箱已经注册过了，请直接点「登录」'],['not confirmed','邮箱还没确认，请先去邮箱点确认链接'],['at least 6','密码至少 6 位'],['rate limit','操作太频繁了，请过几分钟再试'],['invalid format','邮箱格式不对，请检查'],['valid email','邮箱格式不对，请检查']];
async function doAuth(m){var e=val('le'),p=$('lp').value;lerr('');
  if(!e||p.length<6){lerr(!e?'请填写邮箱':'密码至少 6 位');return}
  try{var r=m=='up'?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});
    if(r.error){var g=AUTHERR.find(x=>r.error.message.toLowerCase().indexOf(x[0])>=0);lerr(g?g[1]:'失败：'+r.error.message);return}
    if(m=='up'&&r.data.user&&r.data.user.identities&&!r.data.user.identities.length){lerr('这个邮箱已经注册过了，请直接点「登录」');return}
    if(r.data.session){$('login').style.display='none';await startSync(r.data.session.user.id)}else lerr('注册成功，请先去邮箱点确认链接，再回来登录')}catch(x){lerr('网络出错了，请再试一次')}}
async function logout(){await sb.auth.signOut();try{localStorage.removeItem('health_v1')}catch(e){}location.reload()}
async function startSync(id){try{uid=id;setSync('ing');var rows=[],i=0,r;
  do{r=await sb.from('days').select('day,data').order('day').range(i,i+999);if(r.error)throw r.error;rows=rows.concat(r.data);i+=1000}while(r.data.length==1000);
  var seen={};rows.forEach(x=>{seen[x.day]=1;applyDay(x.day,x.data||{})});
  var m=await sb.from('meta').select('data').maybeSingle();if(m.data&&m.data.data){db.s=Object.assign(db.s,m.data.data);lastMeta=JSON.stringify(db.s)}
  col=true;try{localStorage.setItem('health_v1',JSON.stringify(db))}catch(e){}
  allDays().forEach(k=>{if(!seen[k])cloudDay(k)});cloudMeta();setSync('ok');render()}catch(e){col=null;setSync('err')}}
(async function(){setSync('loc');if(!/^https:/.test(SB_URL)||!window.supabase)return;
  sb=supabase.createClient(SB_URL,SB_KEY);var s=(await sb.auth.getSession()).data.session;if(s)await startSync(s.user.id);else showLogin()})();
render();
</script>
